<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Synthwave Beat Generator</title>
<style>
body { background: #1a0a2e; color: #ff6ec7; font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
h1 { font-size: 2em; text-shadow: 0 0 20px #ff6ec7; }
button { background: #ff6ec7; color: #1a0a2e; border: none; padding: 15px 40px; font-size: 1.2em; font-family: inherit; cursor: pointer; margin: 10px; border-radius: 4px; }
button:hover { background: #ff9ed2; }
button:disabled { opacity: 0.5; cursor: default; }
#status { margin-top: 20px; font-size: 0.9em; color: #7b68ee; }
</style>
</head>
<body>
<h1>⚡ SYNTHWAVE BEAT ⚡</h1>
<div>
<button id="playBtn" onclick="togglePlay()">▶ PLAY</button>
<button id="exportBtn" onclick="exportWAV()">💾 EXPORT WAV</button>
</div>
<div id="status"></div>

<script>
const BPM = 120;
const BEAT = 60 / BPM;
const BARS = 16;
const DURATION = BARS * 4 * BEAT; // 16 bars of 4/4

let actx, playing = false;

function status(msg) { document.getElementById('status').textContent = msg; }

function createBeat(ctx, dest) {
  const master = ctx.createGain();
  master.gain.value = 0.8;
  master.connect(dest);

  // --- KICK ---
  for (let bar = 0; bar < BARS; bar++) {
    for (let b = 0; b < 4; b++) {
      const t = (bar * 4 + b) * BEAT;
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(150, t);
      osc.frequency.exponentialRampToValueAtTime(30, t + 0.15);
      g.gain.setValueAtTime(1, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
      osc.connect(g); g.connect(master);
      osc.start(t); osc.stop(t + 0.25);
    }
  }

  // --- SNARE (noise burst) ---
  const snareBuffer = ctx.createBuffer(1, ctx.sampleRate * 0.2, ctx.sampleRate);
  const sd = snareBuffer.getChannelData(0);
  for (let i = 0; i < sd.length; i++) sd[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / sd.length, 3);

  for (let bar = 0; bar < BARS; bar++) {
    for (let b of [1, 3]) {
      const t = (bar * 4 + b) * BEAT;
      const src = ctx.createBufferSource();
      src.buffer = snareBuffer;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.7, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
      // add body
      const osc = ctx.createOscillator();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(200, t);
      osc.frequency.exponentialRampToValueAtTime(80, t + 0.1);
      const og = ctx.createGain();
      og.gain.setValueAtTime(0.5, t);
      og.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
      osc.connect(og); og.connect(master);
      osc.start(t); osc.stop(t + 0.15);
      src.connect(g); g.connect(master);
      src.start(t);
    }
  }

  // --- HI-HAT (8th notes) ---
  const hhBuffer = ctx.createBuffer(1, ctx.sampleRate * 0.05, ctx.sampleRate);
  const hd = hhBuffer.getChannelData(0);
  for (let i = 0; i < hd.length; i++) hd[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / hd.length, 8);

  for (let bar = 0; bar < BARS; bar++) {
    for (let e = 0; e < 8; e++) {
      const t = (bar * 4 + e * 0.5) * BEAT;
      const src = ctx.createBufferSource();
      src.buffer = hhBuffer;
      const hp = ctx.createBiquadFilter();
      hp.type = 'highpass'; hp.frequency.value = 7000;
      const g = ctx.createGain();
      g.gain.setValueAtTime(e % 2 === 0 ? 0.3 : 0.15, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
      src.connect(hp); hp.connect(g); g.connect(master);
      src.start(t);
    }
  }

  // --- BASS (driving synth bass) ---
  // Classic synthwave bass pattern in Am
  const bassNotes = [55, 55, 65.41, 65.41, 73.42, 73.42, 69.30, 69.30]; // A1 A1 C2 C2 D2 D2 C#2 C#2
  const bassPattern = [
    [0,0,1,0, 0,0,1,0], // 8th note pattern per bar pair
  ];
  for (let bar = 0; bar < BARS; bar++) {
    const noteIdx = Math.floor(bar / 2) % bassNotes.length;
    const freq = bassNotes[noteIdx];
    for (let e = 0; e < 8; e++) {
      const t = (bar * 4 + e * 0.5) * BEAT;
      const hit = (e === 0 || e === 3 || e === 5 || e === 6);
      if (!hit) continue;
      const osc = ctx.createOscillator();
      osc.type = 'sawtooth';
      osc.frequency.value = freq;
      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.setValueAtTime(800, t);
      lp.frequency.exponentialRampToValueAtTime(200, t + BEAT * 0.4);
      lp.Q.value = 5;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.35, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + BEAT * 0.45);
      osc.connect(lp); lp.connect(g); g.connect(master);
      osc.start(t); osc.stop(t + BEAT * 0.5);
    }
  }

  // --- PAD (lush saw pad with chorus feel) ---
  const padChords = [
    [220, 261.63, 329.63], // Am
    [261.63, 329.63, 392],  // C
    [293.66, 349.23, 440],  // Dm
    [329.63, 392, 493.88],  // Em
  ];
  for (let bar = 0; bar < BARS; bar++) {
    const chord = padChords[Math.floor(bar / 4) % padChords.length];
    const t = bar * 4 * BEAT;
    const dur = 4 * BEAT;
    for (const freq of chord) {
      for (let d = -1; d <= 1; d++) { // detune for width
        const osc = ctx.createOscillator();
        osc.type = 'sawtooth';
        osc.frequency.value = freq;
        osc.detune.value = d * 12;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(0.04, t + 0.3);
        g.gain.setValueAtTime(0.04, t + dur - 0.3);
        g.gain.linearRampToValueAtTime(0, t + dur);
        const lp = ctx.createBiquadFilter();
        lp.type = 'lowpass'; lp.frequency.value = 2000;
        osc.connect(lp); lp.connect(g); g.connect(master);
        osc.start(t); osc.stop(t + dur + 0.1);
      }
    }
  }

  // --- ARPEGGIO (classic 80s) ---
  const arpNotes = [440, 523.25, 659.25, 783.99, 659.25, 523.25]; // Am arp up/down
  for (let bar = 0; bar < BARS; bar++) {
    for (let s = 0; s < 16; s++) { // 16th notes
      const t = (bar * 4 + s * 0.25) * BEAT;
      const note = arpNotes[s % arpNotes.length];
      const osc = ctx.createOscillator();
      osc.type = 'square';
      osc.frequency.value = note;
      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 3000;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.08, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + BEAT * 0.2);
      osc.connect(lp); lp.connect(g); g.connect(master);
      osc.start(t); osc.stop(t + BEAT * 0.25);
    }
  }
}

function togglePlay() {
  if (playing) { actx.close(); playing = false; document.getElementById('playBtn').textContent = '▶ PLAY'; status(''); return; }
  actx = new AudioContext();
  createBeat(actx, actx.destination);
  playing = true;
  document.getElementById('playBtn').textContent = '⏹ STOP';
  status('Playing... ' + BARS + ' bars @ ' + BPM + ' BPM');
  setTimeout(() => { if (playing) togglePlay(); }, DURATION * 1000);
}

async function exportWAV() {
  status('Rendering...');
  document.getElementById('exportBtn').disabled = true;
  const offCtx = new OfflineAudioContext(2, 44100 * DURATION, 44100);
  createBeat(offCtx, offCtx.destination);
  const rendered = await offCtx.startRendering();

  // Encode WAV
  const numCh = rendered.numberOfChannels;
  const length = rendered.length;
  const sr = rendered.sampleRate;
  const buffer = new ArrayBuffer(44 + length * numCh * 2);
  const view = new DataView(buffer);

  function writeStr(o, s) { for (let i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); }
  writeStr(0, 'RIFF');
  view.setUint32(4, 36 + length * numCh * 2, true);
  writeStr(8, 'WAVE');
  writeStr(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, numCh, true);
  view.setUint32(24, sr, true);
  view.setUint32(28, sr * numCh * 2, true);
  view.setUint16(32, numCh * 2, true);
  view.setUint16(34, 16, true);
  writeStr(36, 'data');
  view.setUint32(40, length * numCh * 2, true);

  const channels = [];
  for (let c = 0; c < numCh; c++) channels.push(rendered.getChannelData(c));
  let offset = 44;
  for (let i = 0; i < length; i++) {
    for (let c = 0; c < numCh; c++) {
      const s = Math.max(-1, Math.min(1, channels[c][i]));
      view.setInt16(offset, s * 0x7FFF, true);
      offset += 2;
    }
  }

  const blob = new Blob([buffer], { type: 'audio/wav' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'synthwave-beat-120bpm.wav';
  a.click();
  URL.revokeObjectURL(url);
  document.getElementById('exportBtn').disabled = false;
  status('✅ Exported! Check your downloads.');
}
</script>
</body>
</html>
